<script>
/* Conexión con Supabase: imita la interfaz de datos que usa la app */
const SB_URL="https://kuuxcphulirvpfpotjvt.supabase.co";
const SB_KEY="sb_publishable_HETPWwYqSW7HjI9knP4tiw_nusJYRhb";
const SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let UID=null;
const COLS=["movs","pagos","invs","config","neg","productos"];
const subs=[];
const err=e=>({code:(e&&e.code==="invalid_argument")?"invalid_argument":"unavailable",message:(e&&e.message)||String(e)});
async function fetchCol(col){
  const{data,error}=await SB.from("docs").select("id,data").eq("col",col);
  if(error)throw error;return data||[];
}
function emit(col){
  const mine=subs.filter(s=>s.col===col&&s.active);if(!mine.length)return;
  fetchCol(col).then(rows=>{
    for(const s of mine){
      if(s.docId){const r=rows.find(x=>x.id===s.docId);s.next(r?{id:r.id,exists:true,data:()=>r.data,metadata:{fromCache:false,hasPendingWrites:false}}:{id:s.docId,exists:false,data:()=>undefined,metadata:{fromCache:false,hasPendingWrites:false}})}
      else{const docs=rows.map(r=>({id:r.id,exists:true,data:()=>r.data,metadata:{fromCache:false,hasPendingWrites:false}}));s.next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]})}
    }
  }).catch(e=>mine.forEach(s=>s.error&&s.error(err(e))));
}
function subscribe(col,docId,next,error){const s={col,docId,next,error,active:true};subs.push(s);emit(col);return()=>{s.active=false}}
function merge(a,b){const o={...(a||{})};for(const[k,v]of Object.entries(b)){if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=merge(o[k],v);else o[k]=v}return o}
function docRef(col,id){
  return{id,path:col+"/"+id,
    async get(){const{data,error}=await SB.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();if(error)throw err(error);return{id,exists:!!data,data:()=>data?data.data:undefined}},
    async set(data){const{error}=await SB.from("docs").upsert({user_id:UID,col,id,data,updated_at:new Date().toISOString()},{onConflict:"user_id,col,id"});if(error)throw err(error);emit(col)},
    async update(data){const cur=await this.get();if(!cur.exists)throw{code:"invalid_argument",message:"El documento no existe"};await this.set(merge(cur.data(),data))},
    async delete(){const{error}=await SB.from("docs").delete().eq("col",col).eq("id",id);if(error)throw err(error);emit(col)},
    onSnapshot(next,error){return subscribe(col,id,next,error)}};
}
function newId(){const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";const r=crypto.getRandomValues(new Uint8Array(20));for(const b of r)s+=a[b%a.length];return s}
function collRef(col){const q={path:col,where:()=>q,orderBy:()=>q,limit:()=>q,
  doc:id=>docRef(col,id||newId()),
  async add(data){const r=docRef(col,newId());await r.set(data);return r},
  onSnapshot(next,error){return subscribe(col,null,next,error)},
  async get(){const rows=await fetchCol(col);const docs=rows.map(r=>({id:r.id,exists:true,data:()=>r.data}));return{docs,size:docs.length,empty:!docs.length}}};return q}
const DBX={collection:p=>collRef(p),doc:p=>{const[c,i]=p.split("/");return docRef(c,i)}};
window.claude={use:async n=>n==="db"&&UID?DBX:null};
function startRealtime(){
  SB.channel("docs-"+UID).on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const c=(p.new&&p.new.col)||(p.old&&p.old.col);c?emit(c):COLS.forEach(emit)}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")COLS.forEach(emit)});
  window.addEventListener("online",()=>COLS.forEach(emit));
}
</script>
<script>
const DEF_CUENTAS=[{id:"mp",nombre:"Mercado Pago",tipo:"cuenta"},{id:"galicia",nombre:"Galicia",tipo:"cuenta"},{id:"efectivo",nombre:"Efectivo",tipo:"cuenta"},{id:"credito",nombre:"Tarjeta de crédito",tipo:"credito"}];
const CAT_G=["Comida","Supermercado","Transporte","Nafta / moto","Salidas","Servicios","Alquiler","Suscripciones","Salud","Ropa","Educación","Préstamos","Tecno Riv","Otros"];
const CAT_P=[...CAT_G.slice(0,-1),"Tarjeta","Otros"];
const CAT_I=["Sueldo","Sobresueldo","Aguinaldo","Reparto","Retiro Tecno Riv","Rendimientos","Ventas","Freelance","Regalo","Otros"];
const DEF_FIJOS=[{id:"sueldo",nombre:"Sueldo",categoria:"Sueldo",monto:1116000,regla:"habil",n:4,cuenta:"galicia"},{id:"sobre",nombre:"Sobresueldo",categoria:"Sobresueldo",monto:200000,regla:"dia",n:20,cuenta:"galicia"}];
const FERIADOS_FIJOS=["01-01","03-24","04-02","05-01","05-25","06-20","07-09","12-08","12-25"];
function fijos(){return Array.isArray(cfg.fijos)&&cfg.fijos.length?cfg.fijos:DEF_FIJOS}
function esHabil(d){const w=d.getDay();return w!==0&&w!==6&&!FERIADOS_FIJOS.includes(pad(d.getMonth()+1)+"-"+pad(d.getDate()))}
function fechaFijo(f,m){const[y,mm]=m.split("-").map(Number);
  if(f.regla==="habil"){let c=0;for(let d=1;d<=31;d++){const dt=new Date(y,mm-1,d);if(dt.getMonth()!==mm-1)break;if(esHabil(dt)&&++c===f.n)return m+"-"+pad(d)}}
  return m+"-"+pad(Math.min(f.n,new Date(y,mm,0).getDate()))}
function repartoDe(m){return movs.filter(x=>x.tipo==="ingreso"&&x.categoria==="Reparto"&&(x.fecha||"").startsWith(m))}
const TIPOS_INV=["Plazo fijo","FCI / Money market","Dólares","CEDEARs","Acciones","Bonos / ONs","Cripto","Caución","Otro"];
const MEDIO_MAP={"Mercado Pago":"mp","Débito":"galicia","Transferencia":"galicia","Efectivo":"efectivo","Crédito":"credito"};

let db=null;
let movs=[], pagos=[], invs=[], cfg={usd:1450};

if(["#resumen","#movimientos","#pagos","#inversiones","#negocio"].includes(location.hash))tab=location.hash.slice(1);
let month=ym(new Date()), filtro="todos", loaded={m:false,p:false,i:false}, offline=false;

function pad(n){return String(n).padStart(2,"0")}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function shiftMonth(m,k){let[y,mm]=m.split("-").map(Number);mm+=k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+"-"+pad(mm)}
function addMonth(ds){const[y,m,d]=ds.split("-").map(Number);const nm=shiftMonth(y+"-"+pad(m),1);const[ny,nmm]=nm.split("-").map(Number);const last=new Date(ny,nmm,0).getDate();return nm+"-"+pad(Math.min(d,last))}
function daysTo(ds){const[y,m,d]=ds.split("-").map(Number);const a=new Date(y,m-1,d);const t=new Date();t.setHours(0,0,0,0);return Math.round((a-t)/864e5)}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthName(m){const[y,mm]=m.split("-").map(Number);return MESES[mm-1]+" "+y}
function dayLabel(ds){const n=daysTo(ds);if(n===0)return"Hoy";if(n===-1)return"Ayer";const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})}
function shortDate(ds){const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-AR",{day:"numeric",month:"short"})}
function money(n,cur="ARS"){const s=Math.abs(n).toLocaleString("es-AR",{maximumFractionDigits:cur==="USD"?2:0,minimumFractionDigits:0});return (n<-0.004?"−":"")+(cur==="USD"?"US$ ":"$ ")+s}
function toARS(n,cur){return cur==="USD"?n*(+cfg.usd||0):n}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(s){return esc((s||"?").replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"·")}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function note(t){const n=document.getElementById("note");n.textContent=t||"";n.hidden=!t}

/* ---------- cuentas ---------- */
function cuentas(){return Array.isArray(cfg.cuentas)&&cfg.cuentas.length?cfg.cuentas:DEF_CUENTAS}
function cuentaOpts(filter){return cuentas().filter(filter||(()=>true)).map(c=>[c.id,c.nombre])}
function cNombre(id){return cuentas().find(c=>c.id===id)?.nombre||id||"—"}
function esCredito(id){return cuentas().find(c=>c.id===id)?.tipo==="credito"}
function credito(){return cuentas().find(c=>c.tipo==="credito")}
function cuentaDe(m){return m.cuenta||MEDIO_MAP[m.medio]||"mp"}
function saldos(){
  const s={};for(const c of cuentas())s[c.id]=0;
  for(const m of movs){const c=cuentaDe(m),v=toARS(+m.monto||0,m.moneda);
    if(m.tipo==="gasto")s[c]=(s[c]||0)-v;
    else if(m.tipo==="ingreso")s[c]=(s[c]||0)+v;
    else if(m.tipo==="transferencia"){s[c]=(s[c]||0)-v;s[m.destino]=(s[m.destino]||0)+v}
    else if(m.tipo==="ajuste")s[c]=(s[c]||0)+(+m.delta||0);}
  return s;
}

/* ---------- datos ---------- */
let loadTimer=null;
function settle(){if(loaded.m&&loaded.p&&loaded.i){clearTimeout(loadTimer);if(offline){offline=false;note("")}}}
async function boot(){
  render();
  if(!window.claude||!claude.use){note("No se pudo cargar la app. Revisá tu conexión.");return}
  db=await claude.use("db");
  if(!db){note("No se pudo conectar con tus datos. Revisá tu conexión y volvé a entrar.");return}
  loadTimer=setTimeout(()=>{offline=true;note("Todavía no se pudo conectar con tus datos. Lo que ves puede estar desactualizado.")},10000);
  db.collection("movs").onSnapshot(s=>{movs=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.m=true;settle();render()},e=>note("Error leyendo movimientos ("+e.code+")."));
  db.collection("pagos").onSnapshot(s=>{pagos=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.p=true;settle();render()},e=>note("Error leyendo pagos ("+e.code+")."));
  db.collection("invs").onSnapshot(s=>{invs=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.i=true;settle();render()},e=>note("Error leyendo inversiones ("+e.code+")."));
  db.doc("config/main").onSnapshot(s=>{if(s.exists)cfg={...cfg,...s.data()};render()},()=>{});
  db.collection("neg").onSnapshot(s=>{neg=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>note("Error leyendo el negocio ("+e.code+")."));
  db.collection("productos").onSnapshot(s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>note("Error leyendo productos ("+e.code+")."));
}
async function save(col,id,data){
  if(!db){toast("Sin conexión a tus datos");return false}
  try{ if(id)await db.collection(col).doc(id).set(data); else await db.collection(col).add(data); return true }
  catch(e){ toast(e.code==="quota_exceeded"?"Base llena: borrá registros viejos":"No se guardó ("+e.code+")"); return false }
}
async function remove(col,id){try{await db.collection(col).doc(id).delete();return true}catch(e){toast("No se borró ("+e.code+")");return false}}

/* ---------- vistas ---------- */
function movsMes(){return movs.filter(m=>(m.fecha||"").startsWith(month))}
function totals(){
  let ing=0,gas=0,hoy=0;const cats={};
  for(const m of movsMes()){const v=toARS(+m.monto||0,m.moneda);
    if(m.tipo==="ingreso")ing+=v;
    else if(m.tipo==="gasto"){gas+=v;cats[m.categoria||"Otros"]=(cats[m.categoria||"Otros"]||0)+v;if(m.fecha===today())hoy+=v}}
  return{ing,gas,hoy,cats}
}
function pendientes(){return pagos.filter(p=>!p.pagado).sort((a,b)=>(a.vence||"").localeCompare(b.vence||""))}
function chipFor(ds){const n=daysTo(ds);if(n<0)return`<span class="chip late">Vencido hace ${-n} d</span>`;if(n===0)return`<span class="chip soon">Vence hoy</span>`;if(n<=7)return`<span class="chip soon">En ${n} d</span>`;return`<span class="chip ok">${shortDate(ds)}</span>`}

function movItem(m){
  const c=cuentaDe(m);
  if(m.tipo==="transferencia")return`<button class="item" data-edit-mov="${m.id}"><span class="ico tr" aria-hidden="true">⇄</span>
    <span class="mid"><span class="t">${esc(m.nota||"Transferencia")}</span><span class="s">${esc(cNombre(c))} → ${esc(cNombre(m.destino))}</span></span>
    <span class="amt">${money(+m.monto,m.moneda)}</span></button>`;
  if(m.tipo==="ajuste")return`<button class="item" data-edit-mov="${m.id}"><span class="ico tr" aria-hidden="true">±</span>
    <span class="mid"><span class="t">${esc(m.nota||"Ajuste de saldo")}</span><span class="s">${esc(cNombre(c))}</span></span>
    <span class="amt">${(+m.delta>=0?"+":"")+money(+m.delta)}</span></button>`;
  const out=m.tipo!=="ingreso";
  return`<button class="item" data-edit-mov="${m.id}">
    <span class="ico ${out?"out":"in"}">${initials(m.categoria)}</span>
    <span class="mid"><span class="t">${esc(m.nota||m.categoria)}</span><span class="s">${esc(m.categoria)} · ${esc(cNombre(c))}${+m.horas?` · ${(+m.horas).toLocaleString("es-AR")} h`:""}</span></span>
    <span class="amt ${out?"neg":"pos"}">${out?"−":"+"}${money(+m.monto,m.moneda).replace("−","")}${m.moneda==="USD"?`<small>${money(toARS(+m.monto,"USD"))}</small>`:""}</span></button>`
}
function pagoItem(p){
  return`<div class="item"><span class="ico out">${initials(p.concepto)}</span>
    <button class="mid" style="border:0;background:none;text-align:left;padding:0" data-edit-pago="${p.id}"><span class="t">${esc(p.concepto)}</span><span class="s">${chipFor(p.vence)} · ${esc(cNombre(p.cuenta||"mp"))}${p.recurrente==="mensual"?" · mensual":""}</span></button>
    <span class="amt">${money(+p.monto,p.moneda)}<small><button class="btn sm primary" data-pay="${p.id}">Pagar</button></small></span></div>`
}

function vCuentas(){
  const s=saldos(),cs=cuentas(),cred=cs.filter(c=>c.tipo==="credito");
  const disp=cs.filter(c=>c.tipo!=="credito").reduce((a,c)=>a+(s[c.id]||0),0);
  const deuda=cred.reduce((a,c)=>a+Math.max(0,-(s[c.id]||0)),0);
  const sinDatos=!movs.length;
  return`<section class="card full"><h2>Mis cuentas<span class="hbtns"><button class="btn sm" data-act="transfer">⇄ Galicia → MP</button><button class="btn sm" data-act="ajuste">Ajustar saldo</button></span></h2>
    ${sinDatos?`<div class="hint" style="margin-bottom:12px">Para arrancar, tocá cada cuenta y poné el <b>saldo que ves hoy</b> en la app de Mercado Pago y de Galicia. Desde ahí, la app lo mantiene al día con lo que cargues.</div>`:""}
    <div class="accs">${cs.map(c=>{const v=s[c.id]||0;
      if(c.tipo==="credito")return`<button class="acc" data-ajuste="${c.id}"><span class="n">${esc(c.nombre)}</span><span class="v ${v<0?"neg":""}">${v<0?money(-v):"Sin deuda"}</span><span class="h">${v<0?"a pagar":"tocá para cargar la deuda"}</span></button>`;
      return`<button class="acc" data-ajuste="${c.id}"><span class="n">${esc(c.nombre)}</span><span class="v ${v<0?"neg":""}">${money(v)}</span><span class="h">${v<0?"revisá: quedó negativo":"tocá para ajustar"}</span></button>`}).join("")}</div>
    <div class="kv" style="margin-top:10px"><span>Disponible en cuentas</span><b>${money(disp)}</b></div>
    ${deuda?`<div class="kv"><span>Menos deudas (tarjeta y otras)</span><b>${money(disp-deuda)}</b></div>`:""}
  </section>`
}

function vIngresos(){
  const mes=movsMes(),cobrado=cat=>mes.filter(m=>m.tipo==="ingreso"&&m.categoria===cat).reduce((a,m)=>a+toARS(+m.monto,m.moneda),0);
  const fs=fijos(),esperadoFijo=fs.reduce((a,f)=>a+(+f.monto||0),0);
  const rep=repartoDe(month),repTot=rep.reduce((a,m)=>a+toARS(+m.monto,m.moneda),0);
  const hs=rep.reduce((a,m)=>a+(+m.horas||0),0),porH=hs?repTot/hs:0;
  const costos=mes.filter(m=>m.tipo==="gasto"&&m.categoria==="Nafta / moto").reduce((a,m)=>a+toARS(+m.monto,m.moneda),0);
  const prev=[1,2,3].map(k=>repartoDe(shiftMonth(month,-k)).reduce((a,m)=>a+toARS(+m.monto,m.moneda),0)).filter(v=>v>0);
  const prom=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:(+cfg.repartoSemanal||0)*52/12;
  const fijoReal=fs.reduce((a,f)=>a+Math.max(+f.monto||0,cobrado(f.categoria)),0);
  const estimado=fijoReal+Math.max(repTot,prom);
  const totCobrado=mes.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+toARS(+m.monto,m.moneda),0);
  return`<section class="card"><h2>Ingresos del mes<button class="btn sm primary" data-new="reparto">+ Reparto</button></h2>
    <div class="list">${fs.map(f=>{const fe=fechaFijo(f,month),c=cobrado(f.categoria),n=daysTo(fe);
      const estado=c>0?`<span class="chip done">Cobrado${Math.abs(c-f.monto)>=1?" "+money(c):""}</span>`:n>0?`<span class="chip ok">En ${n} d</span>`:`<button class="btn sm primary" data-cobrar="${f.id}">Registrar cobro</button>`;
      return`<div class="item"><span class="ico in">${initials(f.nombre)}</span>
        <button class="mid" style="border:0;background:none;text-align:left;padding:0" data-edit-fijo="${f.id}"><span class="t">${esc(f.nombre)}</span><span class="s">${f.regla==="habil"?f.n+"º día hábil":"Día "+f.n} · ${shortDate(fe)} · ${esc(cNombre(f.cuenta))}</span></button>
        <span class="amt">${money(+f.monto)}<small>${estado}</small></span></div>`}).join("")}
      <div class="item"><span class="ico in">R</span><span class="mid"><span class="t">Reparto · paga los jueves</span><span class="s">${rep.length?`${rep.length} carga${rep.length>1?"s":""}${hs?` · ${hs.toLocaleString("es-AR",{maximumFractionDigits:1})} h · ${money(porH)}/h`:""}${costos?` · neto ${money(repTot-costos)}`:""}`:"Variable según horas"}${prom?` · prom. ${money(prom)}/mes`:""}</span></span><span class="amt pos">${money(repTot)}${month===ym(new Date())?(()=>{const j=juevesRep();return`<small>${j.pendiente?`<button class="btn sm primary" data-rep-fecha="${j.last}">Registrar jue ${shortDate(j.last)}</button>`:`<span class="chip ok">Próx. jue ${shortDate(j.next)}</span>`}</small>`})():""}</span></div>
    </div>
    <div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:10px"><span>Cobrado hasta hoy</span><b class="pos">${money(totCobrado)}</b></div>
    <div class="kv"><span>Fijos del mes</span><b>${money(esperadoFijo)}</b></div>
    <div class="kv"><span>Estimado total${prom>repTot?" (reparto al promedio)":""}</span><b>${money(estimado)}</b></div>
  </section>`
}

function vResumen(){
  const t=totals(),bal=t.ing-t.gas,isCur=month===ym(new Date());
  const pend=pendientes(),prox=pend.filter(p=>(p.vence||"").slice(0,7)===month||(isCur&&daysTo(p.vence)<0));
  const totPend=prox.reduce((a,p)=>a+toARS(+p.monto,p.moneda),0);
  const catArr=Object.entries(t.cats).sort((a,b)=>b[1]-a[1]);const max=catArr[0]?.[1]||1;
  const [y,mm]=month.split("-").map(Number);const dias=isCur?new Date().getDate():new Date(y,mm,0).getDate();
  const invTot=invs.reduce((a,i)=>a+toARS(+i.actual||+i.monto||0,i.moneda),0),invCap=invs.reduce((a,i)=>a+toARS(+i.monto||0,i.moneda),0);
  const s=saldos(),disp=cuentas().filter(c=>c.tipo!=="credito").reduce((a,c)=>a+(s[c.id]||0),0);
  const mes=movsMes();
  return`<div class="view two">
  ${vCuentas()}
  ${vIngresos()}
  <section class="card hero"><h2>Balance de ${monthName(month)}</h2>
    <div class="big ${bal<0?"neg":""}">${money(bal)}</div>
    <div class="sub">≈ ${money(bal/(+cfg.usd||1),"USD")} · dólar ref. ${money(+cfg.usd)} <button class="btn sm" id="editUsd">Cambiar</button></div>
    <div class="split">
      <div class="stat"><div class="k">Ingresos</div><div class="v pos">${money(t.ing)}</div></div>
      <div class="stat"><div class="k">Gastos</div><div class="v neg">${money(t.gas)}</div></div>
      <div class="stat"><div class="k">${isCur?"Gastado hoy":"Movimientos"}</div><div class="v">${isCur?money(t.hoy):mes.length}</div></div>
      <div class="stat"><div class="k">Promedio diario</div><div class="v">${money(t.gas/Math.max(1,dias))}</div></div>
    </div></section>
  <section class="card"><h2>Pagos de ${monthName(month).split(" ")[0]}<button class="btn sm" data-go="pagos">Ver todos</button></h2>
    ${prox.length?`<div class="list">${prox.map(pagoItem).join("")}</div><div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:10px"><span>Total a pagar</span><b>${money(totPend)}</b></div>`
      :`<div class="empty">No te quedan pagos pendientes en ${monthName(month).split(" ")[0]}. <button class="btn sm" data-new="pago">Agregar pago</button></div>`}
    ${prox.length&&movs.length&&disp<totPend?`<div class="note" style="margin:10px 0 0">Ojo: lo que tenés que pagar supera lo que hay en tus cuentas.</div>`:""}
  </section>
  <section class="card"><h2>Gastos por categoría</h2>
    ${catArr.length?`<div class="bars">${catArr.map(([c,v])=>`<div class="bar"><div class="row"><b>${esc(c)}</b><span>${money(v)} · ${Math.round(v/t.gas*100)}%</span></div><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div></div>`).join("")}</div>`
      :`<div class="empty">Todavía no hay gastos en ${monthName(month)}. Tocá <b>+ Gasto</b> para cargar el primero.</div>`}
  </section>
  <section class="card"><h2>Inversiones<button class="btn sm" data-go="inversiones">Ver</button></h2>
    ${invs.length?`<div class="kv"><span>Valor actual</span><b>${money(invTot)}</b></div><div class="kv"><span>Capital invertido</span><b>${money(invCap)}</b></div><div class="kv"><span>Resultado</span><b class="${invTot>=invCap?"pos":"neg"}">${money(invTot-invCap)} (${invCap?((invTot/invCap-1)*100).toFixed(1):0}%)</b></div>`
      :`<div class="empty">Cargá tus plazos fijos, FCI, dólares o CEDEARs para ver el total. <button class="btn sm" data-new="inv">Agregar</button></div>`}
  </section>
  <section class="card"><h2>Últimos movimientos<button class="btn sm" data-go="movimientos">Ver todos</button></h2>
    ${mes.length?`<div class="list">${[...mes].sort(byFechaDesc).slice(0,6).map(movItem).join("")}</div>`:`<div class="empty">Sin movimientos este mes.</div>`}
  </section></div>`
}
function byFechaDesc(a,b){return (b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0)}

function vMovs(){
  let arr=[...movsMes()].sort(byFechaDesc);
  if(filtro!=="todos")arr=arr.filter(m=>filtro==="otros"?(m.tipo==="transferencia"||m.tipo==="ajuste"):m.tipo===filtro);
  const groups={};for(const m of arr)(groups[m.fecha]=groups[m.fecha]||[]).push(m);
  const t=totals();
  return`<div class="view"><section class="card">
    <h2>Movimientos de ${monthName(month)}<span class="hbtns"><button class="btn sm" data-new="transferencia">⇄ Transferir</button><button class="btn sm primary" data-new="ingreso">+ Ingreso</button></span></h2>
    <div class="seg" role="group" aria-label="Filtro">${[["todos","Todos"],["gasto","Gastos"],["ingreso","Ingresos"],["otros","Transf."]].map(([k,l])=>`<button data-filtro="${k}" aria-pressed="${filtro===k}">${l}</button>`).join("")}</div>
    <div class="kv" style="margin-top:8px"><span>Ingresos ${money(t.ing)} · Gastos ${money(t.gas)}</span><b class="${t.ing-t.gas<0?"neg":"pos"}">${money(t.ing-t.gas)}</b></div>
    ${arr.length?Object.entries(groups).map(([d,ms])=>{const s=ms.reduce((a,m)=>a+(m.tipo==="ingreso"?1:m.tipo==="gasto"?-1:0)*toARS(+m.monto,m.moneda),0);return`<div class="day"><span>${dayLabel(d)}</span><span>${money(s)}</span></div><div class="list">${ms.map(movItem).join("")}</div>`}).join("")
      :`<div class="empty" style="padding-top:14px">No hay movimientos ${filtro==="todos"?"":"de este tipo "}en ${monthName(month)}.</div>`}
  </section></div>`
}

function vPagos(){
  const pend=pendientes(),hechos=pagos.filter(p=>p.pagado).sort((a,b)=>(b.pagadoEl||"").localeCompare(a.pagadoEl||"")).slice(0,10);
  const tot=pend.reduce((a,p)=>a+toARS(+p.monto,p.moneda),0),venc=pend.filter(p=>daysTo(p.vence)<0);
  return`<div class="view two"><section class="card">
    <h2>Pendientes<button class="btn sm primary" data-new="pago">+ Pago</button></h2>
    ${venc.length?`<div class="note">${venc.length} pago${venc.length>1?"s":""} vencido${venc.length>1?"s":""}.</div>`:""}
    ${pend.length?`<div class="list">${pend.map(pagoItem).join("")}</div><div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:10px"><span>Total pendiente</span><b>${money(tot)}</b></div>`
      :`<div class="empty">No tenés pagos pendientes. Cargá alquiler, tarjeta, servicios o cuotas y te avisa cuando se acercan. Los mensuales se renuevan solos al pagarlos.</div>`}
  </section>
  ${(()=>{const pm={};for(const p of pend){const k=(p.vence||"").slice(0,7);pm[k]=(pm[k]||0)+toARS(+p.monto,p.moneda)}
    const ks=Object.keys(pm).sort();if(!ks.length)return"";const fijo=fijos().reduce((a,f)=>a+(+f.monto||0),0),mx=Math.max(...ks.map(k=>pm[k]),fijo);
    return`<section class="card"><h2>Compromisos por mes</h2><div class="bars">${ks.map(k=>{const v=pm[k],pc=fijo?Math.round(v/fijo*100):0;return`<div class="bar"><div class="row"><b style="text-transform:capitalize">${monthName(k)}</b><span class="${pc>=100?"neg":""}">${money(v)} · ${pc}% del fijo</span></div><div class="track"><div class="fill" style="width:${(v/mx*100).toFixed(1)}%;${pc>=60?"background:var(--out)":""}"></div></div></div>`}).join("")}</div>
    <div class="empty" style="font-size:.8rem">Comparado con tu ingreso fijo de ${money(fijo)} (sueldo + sobresueldo). En rojo, los meses que se comen más del 60%.</div></section>`})()}
  <section class="card"><h2>Pagados recientes</h2>
    ${hechos.length?`<div class="list">${hechos.map(p=>`<button class="item" data-edit-pago="${p.id}"><span class="ico in">${initials(p.concepto)}</span><span class="mid"><span class="t">${esc(p.concepto)}</span><span class="s"><span class="chip done">Pagado ${p.pagadoEl?shortDate(p.pagadoEl):""}</span></span></span><span class="amt">${money(+p.monto,p.moneda)}</span></button>`).join("")}</div>`
      :`<div class="empty">Los pagos únicos que marques como pagados aparecen acá. Cada pago también se descuenta de la cuenta desde la que pagás.</div>`}
  </section></div>`
}

function vInvs(){
  const arr=[...invs].sort((a,b)=>toARS(+b.actual||+b.monto,b.moneda)-toARS(+a.actual||+a.monto,a.moneda));
  const tot=arr.reduce((a,i)=>a+toARS(+i.actual||+i.monto||0,i.moneda),0),cap=arr.reduce((a,i)=>a+toARS(+i.monto||0,i.moneda),0);
  const porTipo={};for(const i of arr)porTipo[i.tipo]=(porTipo[i.tipo]||0)+toARS(+i.actual||+i.monto||0,i.moneda);
  const tipos=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
  return`<div class="view two"><section class="card">
    <h2>Cartera<button class="btn sm primary" data-new="inv">+ Inversión</button></h2>
    ${arr.length?`<div class="list">${arr.map(i=>{const act=+i.actual||+i.monto,r=+i.monto?(act/+i.monto-1)*100:0;return`<button class="item" data-edit-inv="${i.id}"><span class="ico inv">${initials(i.tipo)}</span><span class="mid"><span class="t">${esc(i.nombre)}</span><span class="s">${esc(i.tipo)} · desde ${i.fecha?shortDate(i.fecha):"—"}${i.vence?" · vence "+shortDate(i.vence):""}</span></span><span class="amt">${money(act,i.moneda)}<small class="${r>=0?"pos":"neg"}">${r>=0?"+":""}${r.toFixed(1)}%</small></span></button>`}).join("")}</div>`
      :`<div class="empty">Sin inversiones cargadas. Sumá plazos fijos, FCI, dólares, CEDEARs o cripto. Actualizá el <b>valor actual</b> cada tanto para ver el rendimiento.</div>`}
    <div class="hint" style="margin-top:12px">La plata en cuenta de Mercado Pago ya rinde a diario. Esa no la cargues acá: cuando ajustes el saldo de MP, elegí <b>Rendimiento</b> y queda como ingreso.</div>
  </section>
  <section class="card"><h2>Resumen</h2>
    <div class="kv"><span>Valor actual (en $)</span><b>${money(tot)}</b></div>
    <div class="kv"><span>En dólares</span><b>${money(tot/(+cfg.usd||1),"USD")}</b></div>
    <div class="kv"><span>Capital invertido</span><b>${money(cap)}</b></div>
    <div class="kv"><span>Resultado</span><b class="${tot>=cap?"pos":"neg"}">${money(tot-cap)}</b></div>
    ${tipos.length?`<div class="bars" style="margin-top:12px">${tipos.map(([k,v])=>`<div class="bar"><div class="row"><b>${esc(k)}</b><span>${Math.round(v/tot*100)}%</span></div><div class="track"><div class="fill" style="width:${(v/tot*100).toFixed(1)}%"></div></div></div>`).join("")}</div>`:""}
    <div class="empty" style="font-size:.8rem">Montos en USD convertidos al dólar de referencia ${money(+cfg.usd)}.</div>
  </section></div>`
}

function openSheet(title,fields,init,onSave,onDelete){
  const bg=document.createElement("div");bg.className="sheet-bg";
  const st={...init};let noFocus=false;
  const h=f=>{
    const val=st[f.k]??"";const id="f_"+f.k;
    if(f.type==="info")return`<div class="hint">${f.html}</div>`;
    if(f.type==="seg")return`<div class="seg" role="group" aria-label="${f.label}">${f.opts.map(([k,l,c])=>`<button type="button" class="${c||""}" data-seg="${f.k}" data-v="${k}" aria-pressed="${val===k}">${l}</button>`).join("")}</div>`;
    if(f.type==="select")return`<label for="${id}">${f.label}<select id="${id}" name="${f.k}" ${f.redraw?"data-redraw":""}>${f.opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(l)}</option>`}).join("")}</select></label>`;
    if(f.type==="pair")return`<div class="pair">${f.items.map(h).join("")}</div>`;
    return`<label for="${id}" class="${f.cls||""}">${f.label}<input id="${id}" name="${f.k}" type="${f.type}" ${f.type==="number"?'inputmode="decimal" step="any" min="0"':""} value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}></label>`;
  };
  const draw=()=>{bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><form class="f" novalidate>${fields(st).map(h).join("")}<div class="err" hidden></div><div class="actions">${onDelete?`<button type="button" class="btn danger" data-del>Borrar</button>`:""}<div class="r"><button type="button" class="btn" data-x>Cancelar</button>${onSave?`<button class="btn primary">Guardar</button>`:""}</div></div></form></div>`;
    const first=bg.querySelector(".amount input")||bg.querySelector("input");if(first&&!noFocus)setTimeout(()=>first.focus(),30)};
  const read=()=>{bg.querySelectorAll("input,select").forEach(i=>st[i.name]=i.type==="number"?(i.value===""?"":+i.value):i.value)};
  draw();document.body.appendChild(bg);
  const close=()=>{bg.remove();document.removeEventListener("keydown",onKey)};
  const onKey=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",onKey);
  let confirmDel=false;
  bg.addEventListener("change",e=>{if(e.target.matches("[data-redraw]")){read();noFocus=true;draw()}});
  bg.addEventListener("click",async e=>{
    if(e.target===bg||e.target.closest("[data-x]"))return close();
    const s=e.target.closest("[data-seg]");if(s){read();st[s.dataset.seg]=s.dataset.v;noFocus=true;draw();return}
    if(e.target.closest("[data-del]")){const b=e.target.closest("[data-del]");if(!confirmDel){confirmDel=true;b.textContent="¿Seguro? Tocá de nuevo";return}if(await onDelete())close()}
  });
  bg.addEventListener("submit",async e=>{e.preventDefault();if(!onSave)return;read();const err=onSave(st);const box=bg.querySelector(".err");
    if(typeof err==="string"){box.textContent=err;box.hidden=false;return}
    const b=bg.querySelector("button.primary");b.disabled=true;b.textContent="Guardando…";
    if(await err)close();else{b.disabled=false;b.textContent="Guardar"}});
}

async function pagar(id){
  const p=pagos.find(x=>x.id===id);if(!p||!db)return;
  const desde=p.cuenta||"mp",cred=credito(),esTarjeta=p.categoria==="Tarjeta"&&cred;
  const antes=saldos()[desde]||0,falta=Math.round((toARS(+p.monto,p.moneda)-antes)*100)/100;
  const base={monto:+p.monto,moneda:p.moneda,cuenta:desde,fecha:today(),nota:p.concepto,creado:Date.now(),pagoId:p.id};
  const ok=await save("movs",null,esTarjeta?{...base,tipo:"transferencia",destino:cred.id}:{...base,tipo:"gasto",categoria:p.categoria||"Servicios"});
  if(!ok){render();return}
  const upd=p.recurrente==="mensual"?{vence:addMonth(p.vence)}:{pagado:true,pagadoEl:today()};
  try{await db.collection("pagos").doc(id).update(upd);toast(p.recurrente==="mensual"?`Pagado desde ${cNombre(desde)}. Próximo: ${shortDate(upd.vence)}`:`Pagado desde ${cNombre(desde)}`)}catch(e){toast("Se registró el pago pero no se movió el vencimiento")}
  if(falta>0.5){const origen=cuentas().find(c=>c.tipo!=="credito"&&c.id!==desde&&(saldos()[c.id]||0)>=falta)?.id||(desde==="mp"?"efectivo":"mp");
    setTimeout(()=>movForm("transferencia",{cuenta:origen,destino:desde,monto:falta,nota:"Plata para "+p.concepto}),400);
    toast(`${cNombre(desde)} no tenía saldo: registrá de dónde pasaste la plata`)}
}

let neg=[], prods=[];

function negMes(){return neg.filter(n=>(n.fecha||"").startsWith(month))}

function vTot(v){return(+v.cantidad||0)*(+v.precio||0)}
function vCos(v){return(+v.cantidad||0)*(+v.costo||0)}
function cTot(c){return(+c.cantidad||0)*(+c.costo||0)}
function cajaNeg(){let s=0;for(const n of neg){
  if(n.tipo==="venta")s+=vTot(n);else if(n.tipo==="compra")s-=cTot(n);
  else if(n.tipo==="gasto"||n.tipo==="retiro")s-=(+n.monto||0);else if(n.tipo==="aporte")s+=(+n.monto||0);
  else if(n.tipo==="ajuste")s+=(+n.delta||0)}return s}
function negStats(arr){
  const v=arr.filter(n=>n.tipo==="venta"),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const ventas=sum(v,vTot),cmv=sum(v,vCos),uds=sum(v,x=>+x.cantidad||0);

async function ajStock(pid,delta,costoNuevo,cant){
  const p=prodById(pid);if(!p||!db||p.botId)return;const st=+p.stock||0,upd={stock:st+delta};
  if(costoNuevo!=null)upd.costo=st>0?Math.round((st*(+p.costo||0)+cant*costoNuevo)/(st+cant)*100)/100:costoNuevo;
  try{await db.collection("productos").doc(pid).update(upd)}catch(e){toast("No se actualizó el stock")}
}

      const ref=r?db.collection("neg").doc(r.id):db.collection("neg").doc(),monto=+st.monto,fecha=st.fecha||today(),nota=(st.nota||"").trim();
      const ok=await save("neg",ref.id,{tipo,monto,cuenta:st.cuenta,fecha,nota,creado:r?.creado||Date.now()});if(!ok)return false;
      const mov=ret?{tipo:"ingreso",categoria:"Retiro Tecno Riv",cuenta:st.cuenta,monto,moneda:"ARS",fecha,nota:nota||"Retiro de Tecno Riv",negId:ref.id,creado:Date.now()}
        :(tieneDeuda?{tipo:"transferencia",cuenta:st.cuenta,destino:"tecnoriv",monto,moneda:"ARS",fecha,nota:nota||"Plata para Tecno Riv",negId:ref.id,creado:Date.now()}
        :{tipo:"gasto",categoria:"Tecno Riv",cuenta:st.cuenta,monto,moneda:"ARS",fecha,nota:nota||"Plata para Tecno Riv",negId:ref.id,creado:Date.now()});
      await save("movs","neg-"+ref.id,mov);toast(ret?"Retiro cargado en el negocio y en tu cuenta":"Aporte cargado");return true})();
  },r?()=>removeNeg(r):null);
}
function cajaForm(){
  openSheet("Ajustar caja del negocio",()=>[
    {type:"number",k:"real",label:"Plata del negocio hoy (lo que tiene en su cuenta y en mano)",cls:"amount",ph:"0"},
    {type:"info",html:`Según lo cargado: <b>${money(cajaNeg())}</b>. Contá solo la plata del negocio, no la tuya.`}
  ],{real:""},st=>{
    if(st.real===""||isNaN(+st.real))return"Poné el monto.";const delta=Math.round((+st.real-cajaNeg())*100)/100;
    if(Math.abs(delta)<0.5){toast("La caja ya coincide");return Promise.resolve(true)}
    return save("neg",null,{tipo:"ajuste",delta,fecha:today(),nota:"Caja real "+money(+st.real),creado:Date.now()}).then(ok=>{ok&&toast("Caja del negocio actualizada");return ok});
  });
}
async function removeNeg(n){
  const ok=await remove("neg",n.id);if(!ok)return false;
  if(n.tipo==="venta"&&n.productoId)await ajStock(n.productoId,+n.cantidad||0);
  if(n.tipo==="compra"&&n.productoId)await ajStock(n.productoId,-(+n.cantidad||0));
  if(n.tipo==="retiro"||n.tipo==="aporte")await remove("movs","neg-"+n.id);
  toast("Borrado");return true;
}
function negEdit(id){const n=neg.find(x=>x.id===id);if(!n)return;
  ({venta:ventaForm,compra:compraForm,gasto:gastoNegForm,retiro:retiroForm,aporte:retiroForm}[n.tipo]||((x)=>openSheet("Ajuste de caja",()=>[{type:"info",html:`${esc(x.nota||"")} (${(+x.delta>=0?"+":"")+money(+x.delta)}). Si lo borrás, la caja vuelve al valor calculado.`}],{},null,()=>removeNeg(x))))(n)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||t.closest(".sheet-bg"))return;
  if(t.dataset.nview){nview=t.dataset.nview;try{localStorage.setItem("nview",nview)}catch(_){}if(tab!=="negocio")tab="negocio";render();return}
  if(t.dataset.nedit)return negEdit(t.dataset.nedit);
  if(t.dataset.nprod){const p=prodById(t.dataset.nprod);p&&productoForm(p);return}
  const a=t.dataset.nact;if(!a)return;
  ({venta:()=>ventaForm(),compra:()=>compraForm(),producto:()=>productoForm(),gasto:()=>gastoNegForm(),retiro:()=>retiroForm(null,"retiro"),aporte:()=>retiroForm(null,"aporte"),caja:cajaForm}[a]||(()=>{}))();
});

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||t.closest(".sheet-bg"))return;
  if(t.dataset.tab||t.dataset.go){tab=t.dataset.tab||t.dataset.go;try{localStorage.setItem("tab",tab)}catch(_){}history.replaceState(null,"","#"+tab);render();window.scrollTo(0,0);return}
  if(t.dataset.filtro){filtro=t.dataset.filtro;render();return}
  if(t.dataset.editMov){const m=movs.find(x=>x.id===t.dataset.editMov);m&&movForm(m);return}
  if(t.dataset.editPago){const p=pagos.find(x=>x.id===t.dataset.editPago);p&&pagoForm(p);return}
  if(t.dataset.editInv){const i=invs.find(x=>x.id===t.dataset.editInv);i&&invForm(i);return}
  if(t.dataset.ajuste){ajusteForm(t.dataset.ajuste);return}
  if(t.dataset.cobrar){cobrar(t.dataset.cobrar);return}
  if(t.dataset.editFijo){fijoForm(t.dataset.editFijo);return}
  if(t.dataset.new==="reparto")return repartoForm();
  if(t.dataset.repFecha)return repartoForm(t.dataset.repFecha);
  if(t.dataset.pay){t.disabled=true;pagar(t.dataset.pay);return}
  if(t.dataset.act==="ajuste")return ajusteForm("mp");
  if(t.dataset.act==="transfer")return movForm("transferencia");
  if(t.dataset.new==="pago")return pagoForm();
  if(t.dataset.new==="inv")return invForm();
  if(t.dataset.new==="ingreso")return movForm("ingreso");
  if(t.dataset.new==="transferencia")return movForm("transferencia");
  if(t.id==="editUsd")return usdForm();
});
document.getElementById("fab").onclick=()=>tab==="negocio"?ventaForm():movForm("gasto");
document.getElementById("fab2").onclick=()=>{if(tab==="negocio")return compraForm();const j=juevesRep();repartoForm(j.pendiente?j.last:null)};

document.getElementById("mNext").onclick=()=>{month=shiftMonth(month,1);render()};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["resumen","movimientos","pagos","inversiones","negocio"].includes(h)){tab=h;render()}});

<style>
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.gate .box{width:100%;max-width:380px;display:grid;gap:18px}
.gate .logo{width:64px;height:64px;border-radius:16px}
.gate h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em}
.gate p{margin:0;color:var(--muted)}
.gate .row{display:flex;gap:8px;flex-wrap:wrap}
.gate .row .btn{flex:1;padding:12px 14px}
.gate .msg{font-size:.88rem;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.gate .msg.bad{background:var(--out-soft);color:var(--out)}
.brand .out{border:0;background:none;padding:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
</style>
<div class="gate" id="gate" hidden>
  <form class="box f" id="gateForm" novalidate>
    <img class="logo" src="icon-192.png" alt="">
    <div><h1>Finanzas</h1><p>Entrá con tu email para ver tus cuentas, pagos e ingresos en el celu y en la compu.</p></div>
    <label for="g_email">Email<input id="g_email" type="email" autocomplete="email" inputmode="email" required></label>
    <label for="g_pass">Contraseña<input id="g_pass" type="password" autocomplete="current-password" minlength="6" required></label>
    <div class="msg" id="gateMsg" hidden></div>
    <div class="row"><button class="btn primary" id="g_in">Entrar</button><button type="button" class="btn" id="g_up" style="display:none">Crear cuenta</button></div>
  </form>
</div>
<script>
/* Inicio de sesión y arranque */
(async()=>{
  const gate=document.getElementById("gate"),form=document.getElementById("gateForm"),msg=document.getElementById("gateMsg");
  const show=(t,bad)=>{msg.textContent=t;msg.hidden=!t;msg.className="msg"+(bad?" bad":"")};
  const traducir=m=>/Invalid login/i.test(m)?"Email o contraseña incorrectos.":/not confirmed/i.test(m)?"Todavía no confirmaste el email. Revisá tu correo.":/already registered/i.test(m)?"Ese email ya tiene cuenta. Tocá Entrar.":/at least 6/i.test(m)?"La contraseña tiene que tener al menos 6 caracteres.":m;
  let started=false;
  const go=s=>{if(started)return;started=true;UID=s.user.id;gate.hidden=true;startRealtime();boot()};
  const{data:{session}}=await SB.auth.getSession();
  if(session)go(session);else gate.hidden=false;
  SB.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT")location.reload();else if(s&&!started)go(s)});
  const creds=()=>({email:document.getElementById("g_email").value.trim(),password:document.getElementById("g_pass").value});
  form.addEventListener("submit",async e=>{e.preventDefault();const c=creds();if(!c.email||!c.password)return show("Completá email y contraseña.",true);
    show("Entrando…");const{data,error}=await SB.auth.signInWithPassword(c);if(error)return show(traducir(error.message),true);go(data.session)});
  document.getElementById("g_up").addEventListener("click",async()=>{const c=creds();if(!c.email||c.password.length<6)return show("Poné tu email y una contraseña de al menos 6 caracteres.",true);
    show("Creando cuenta…");const{data,error}=await SB.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error)return show(traducir(error.message),true);
    if(data.session)go(data.session);else show("Listo. Te mandamos un email para confirmar la cuenta. Tocá el link y después volvé acá y tocá Entrar.")});
  document.getElementById("logout").addEventListener("click",()=>SB.auth.signOut());
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
